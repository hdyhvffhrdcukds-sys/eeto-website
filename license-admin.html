<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MIRACLE 라이선스 관리</title>
  <style>
    :root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#17212b;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:42px 20px}header{margin-bottom:24px}h1{margin:0;font-size:28px}p{color:#56616d}.card{background:#fff;border:1px solid #d9e1e8;border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #182c3d0b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.wide{grid-column:1/-1}label{display:grid;gap:7px;font-weight:700;font-size:14px}input,select,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #afbdc9}button{border:0;background:#087ea4;color:white;font-weight:800;cursor:pointer}button.alt{background:#4a5968}button.danger{background:#b42318}button:disabled{opacity:.55;cursor:wait}.note{font-size:13px;color:#697785}.hidden{display:none}pre{white-space:pre-wrap;background:#17212b;color:#eaf2f8;padding:15px;border-radius:9px;max-height:260px;overflow:auto}.license{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid #e5eaef;padding:15px 0}.badge{font-size:12px;background:#e6f4ea;color:#166534;border-radius:99px;padding:4px 8px}@media(max-width:640px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.license{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="wrap">
  <header><h1>MIRACLE 라이선스 관리</h1><p>관리자 키와 고객 라이선스는 이 브라우저에 저장되지 않습니다.</p></header>
  <section class="card"><div class="grid">
    <label class="wide">관리자 키 <input id="adminKey" type="password" autocomplete="off" placeholder="관리자 키를 입력하면 목록을 자동으로 불러옵니다"><span class="note">입력 후 잠시 기다리거나 Enter를 누르세요. 고객사명 등 발급 정보는 입력하지 않아도 됩니다.</span></label>
    <div class="wide"><button class="alt" id="openKeyChange">관리자 키 변경</button></div>
    <div class="wide hidden" id="keyChangePanel">
      <p class="note">위에 현재 관리자 키를 입력하세요. 변경 후 이전 키는 사용할 수 없습니다. 고객 라이선스는 유지됩니다.</p>
      <label>새 관리자 키 <input id="newAdminKey" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="12자 이상 입력"></label>
      <label>새 관리자 키 확인 <input id="confirmAdminKey" type="password" autocomplete="new-password" maxlength="128"></label>
      <p><button type="button" class="alt" id="generateKey">안전한 키 자동 생성</button> <button type="button" class="alt" id="showNewKey">새 키 보기</button></p>
      <label><span><input id="keySaved" type="checkbox"> 새 키를 비밀번호 관리자 등 안전한 곳에 보관했습니다.</span></label>
      <p><button id="changeKey">변경 적용</button> <button class="alt" id="cancelKeyChange">취소</button></p>
      <p id="keyChangeStatus" role="status" aria-live="polite"></p>
    </div>
    <label>고객사명 <input id="customerName" maxlength="120" placeholder="예: 레이저링크"></label>
    <label>허용 PC 수 <input id="maxDevices" type="number" min="1" max="50" value="1"></label>
    <label>만료일 <input id="expiresAt" type="date"></label>
    <label>제품 기능 <input value="스마트팩" readonly aria-label="제품 기능"></label>
    <div class="wide"><button id="create">새 라이선스 발급</button> <span class="note">발급한 라이선스 번호는 아래 목록에서 다시 확인할 수 있습니다.</span></div>
  </div></section>
  <section class="card"><button class="alt" id="refresh">라이선스 목록 새로고침</button><div id="result" class="hidden"></div><div id="list"></div></section>
</main><script>
const API='https://eeto-miracle-license.jjmen.workers.dev/v1/admin/licenses';
const $=id=>document.getElementById(id),out=$('result'),list=$('list');
function key(){return $('adminKey').value.trim()} function show(value){out.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);out.classList.remove('hidden')}
async function call(url,options={}){if(!key())throw Error('관리자 키를 입력하세요.');const response=await fetch(url,{...options,headers:{'content-type':'application/json','x-admin-key':key(),...(options.headers||{})}});const data=await response.json().catch(()=>({message:'서버 응답을 읽을 수 없습니다.'}));if(!response.ok)throw Error(data.message||data.code||'요청에 실패했습니다.');return data}
function stamp(value){return value?new Date(value).toLocaleDateString('ko-KR'):'제한 없음'}
let requestVersion=0,lookupTimer;
function resetKeyPanel(){for(const id of ['newAdminKey','confirmAdminKey']){$(id).value='';$(id).type='password'}$('keySaved').checked=false;$('showNewKey').textContent='새 키 보기';$('keyChangeStatus').textContent='';$('keyChangePanel').classList.add('hidden')}
$('openKeyChange').onclick=()=>{$('keyChangePanel').classList.remove('hidden');$('newAdminKey').focus()};
$('cancelKeyChange').onclick=resetKeyPanel;
for(const id of ['newAdminKey','confirmAdminKey'])$(id).oninput=()=>{$('keySaved').checked=false};
$('generateKey').onclick=()=>{const bytes=crypto.getRandomValues(new Uint8Array(32));const value='MIR-ADMIN-'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');$('newAdminKey').value=value;$('confirmAdminKey').value=value;$('keySaved').checked=false};
$('showNewKey').onclick=()=>{const visible=$('newAdminKey').type==='password';$('newAdminKey').type=visible?'text':'password';$('showNewKey').textContent=visible?'새 키 숨기기':'새 키 보기'};
$('changeKey').onclick=async()=>{
  const next=$('newAdminKey').value;
  if(!/^[!-~]{12,128}$/.test(next)){$('keyChangeStatus').textContent='공백 없이 영문·숫자·기호 12~128자를 입력하세요.';return}
  if(next!==$('confirmAdminKey').value){$('keyChangeStatus').textContent='새 키와 확인 값이 다릅니다.';return}
  if(!$('keySaved').checked){$('keyChangeStatus').textContent='새 키를 보관한 뒤 확인란을 선택하세요.';return}
  if(!confirm('관리자 키를 변경할까요? 이전 키는 즉시 사용할 수 없게 됩니다.'))return;
  const controls=['changeKey','cancelKeyChange','generateKey','newAdminKey','confirmAdminKey','adminKey'];
  try{controls.forEach(id=>$(id).disabled=true);clearTimeout(lookupTimer);requestVersion++;
    await call(API.replace('/licenses','/key'),{method:'POST',body:JSON.stringify({newKey:next,confirmKey:$('confirmAdminKey').value})});
    $('adminKey').value=next;resetKeyPanel();show('관리자 키가 변경되었습니다. 현재 화면은 새 키로 연결됩니다.');await refresh();
  }catch(e){$('keyChangeStatus').textContent=e.message+' 응답이 끊겼다면 보관한 새 키로 접속을 확인하세요.'}
  finally{controls.forEach(id=>$(id).disabled=false)}
};
async function refresh(){const version=++requestVersion;try{$('refresh').disabled=true;const data=await call(API);if(version!==requestVersion)return;list.innerHTML=data.licenses.map(x=>`<article class="license"><div><strong>${escape(x.customer_name)}</strong> <span class="badge">${x.enabled?'사용':'중지'}</span><div class="note">라이선스 번호: ${escape(x.key_value||`기존 발급본 · 끝 ${x.key_suffix}`)} · PC ${x.active_devices}/${x.max_devices} · 만료 ${stamp(x.expires_at)}</div></div><div><button class="alt" data-edit="${x.id}" data-expiry="${x.expires_at||''}" data-devices="${x.max_devices}">기간·PC 수정</button> <label style="display:inline-flex;align-items:center;gap:6px;margin:0 10px"><input type="checkbox" data-permanent="${x.id}" ${x.expires_at?'':'checked'} aria-label="영구락">영구락</label> <button class="danger" data-id="${x.id}" data-enabled="${x.enabled?0:1}">${x.enabled?'중지':'재활성화'}</button> <button class="danger" data-delete="${x.id}" data-name="${escape(x.customer_name)}">삭제</button></div></article>`).join('')||'<p class="note">등록된 라이선스가 없습니다.</p>';}catch(e){if(version===requestVersion){list.textContent='';show(e.message)}}finally{if(version===requestVersion)$('refresh').disabled=false}}
list.addEventListener('change',async e=>{
  const box=e.target.closest('input[data-permanent]');if(!box)return;
  const permanent=box.checked;let expiresAt=null;
  if(permanent){if(!confirm('이 업체의 만료일을 없애고 영구 사용으로 변경할까요? 허용 PC 수와 사용 중지 상태는 유지됩니다.')){box.checked=false;return}}
  else{
    const date=prompt('영구락 해제 후 적용할 만료일을 입력하세요. (YYYY-MM-DD, 한국시간 해당 날짜 끝까지)');
    if(date===null){box.checked=true;return}
    const parsed=new Date(date+'T23:59:59+09:00');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(parsed.getTime())||new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date||parsed.getTime()<=Date.now()){
      box.checked=true;show('미래의 올바른 만료일을 입력하세요.');return;
    }
    expiresAt=parsed.toISOString();
  }
  try{box.disabled=true;await call(`${API}/${box.dataset.permanent}/permanent`,{method:'POST',body:JSON.stringify({permanent,expiresAt})});show(permanent?'영구락 적용 완료 · 만료일 없음':'영구락 해제 완료 · 만료일 지정');await refresh()}
  catch(error){box.checked=!permanent;show(error.message+' 목록을 새로고침해 저장 상태를 확인하세요.')}
  finally{box.disabled=false}
});
$('refresh').onclick=()=>{clearTimeout(lookupTimer);out.classList.add('hidden');refresh()};
$('adminKey').addEventListener('input',()=>{clearTimeout(lookupTimer);requestVersion++;list.textContent='';out.textContent='';out.classList.add('hidden');$('refresh').disabled=false;if(key())lookupTimer=setTimeout(refresh,900)});
$('adminKey').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('refresh').onclick()}});
function escape(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
$('create').onclick=async()=>{try{$('create').disabled=true;const expires=$('expiresAt').value;const body={customerName:$('customerName').value.trim(),maxDevices:Number($('maxDevices').value),expiresAt:expires?new Date(expires+'T23:59:59+09:00').toISOString():null,features:['smart-pack']};const data=await call(API,{method:'POST',body:JSON.stringify(body)});show(`발급 완료 · ${data.customerName} · 라이선스 번호: ${data.licenseKey}`);await refresh()}catch(e){show(e.message)}finally{$('create').disabled=false}};
list.onclick=async e=>{const edit=e.target.closest('button[data-edit]');if(edit){const current=edit.dataset.expiry?edit.dataset.expiry.slice(0,10):'';const date=prompt('새 만료일 (YYYY-MM-DD). 비워두면 만료일 제한 없음.',current);if(date===null)return;const devices=prompt('허용 PC 수 (1~50)',edit.dataset.devices);if(devices===null)return;try{await call(`${API}/${edit.dataset.edit}/update`,{method:'POST',body:JSON.stringify({expiresAt:date,maxDevices:Number(devices)})});await refresh()}catch(e){show(e.message)}return}const remove=e.target.closest('button[data-delete]');if(remove){if(!confirm(`'${remove.dataset.name}' 라이선스를 삭제할까요? 연결된 PC 활성화 기록도 함께 삭제되며 되돌릴 수 없습니다.`))return;try{remove.disabled=true;await call(`${API}/${remove.dataset.delete}`,{method:'DELETE'});await refresh()}catch(e){show(e.message);remove.disabled=false}return}const b=e.target.closest('button[data-id]');if(!b)return;try{b.disabled=true;await call(`${API}/${b.dataset.id}/status`,{method:'POST',body:JSON.stringify({enabled:b.dataset.enabled==='1'})});await refresh()}catch(e){show(e.message);b.disabled=false}};
</script></body></html>
