<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MIRACLE 라이선스 관리</title>
  <style>
    :root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#17212b;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:42px 20px}header{margin-bottom:24px}h1{margin:0;font-size:28px}p{color:#56616d}.card{background:#fff;border:1px solid #d9e1e8;border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #182c3d0b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.wide{grid-column:1/-1}label{display:grid;gap:7px;font-weight:700;font-size:14px}input,select,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #afbdc9}button{border:0;background:#087ea4;color:white;font-weight:800;cursor:pointer}button.alt{background:#4a5968}button.danger{background:#b42318}button:disabled{opacity:.55;cursor:wait}.note{font-size:13px;color:#697785}.hidden{display:none}pre{white-space:pre-wrap;background:#17212b;color:#eaf2f8;padding:15px;border-radius:9px;max-height:260px;overflow:auto}.license{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid #e5eaef;padding:15px 0}.badge{font-size:12px;background:#e6f4ea;color:#166534;border-radius:99px;padding:4px 8px}@media(max-width:640px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.license{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="wrap">
  <header><h1>MIRACLE 라이선스 관리</h1><p>관리자 키와 고객 라이선스는 이 브라우저에 저장되지 않습니다.</p></header>
  <section class="card"><div class="grid">
    <label class="wide">관리자 키 <input id="adminKey" type="password" autocomplete="off" placeholder="Cloudflare에 저장한 ADMIN_API_KEY"></label>
    <label>고객사명 <input id="customerName" maxlength="120" placeholder="예: 레이저링크"></label>
    <label>허용 PC 수 <input id="maxDevices" type="number" min="1" max="50" value="1"></label>
    <label>만료일 <input id="expiresAt" type="date"></label>
    <label>제품 기능 <input value="스마트팩" readonly aria-label="제품 기능"></label>
    <div class="wide"><button id="create">새 라이선스 발급</button> <span class="note">발급 키는 한 번만 표시됩니다. 즉시 고객에게 전달하거나 안전한 곳에 보관하세요.</span></div>
  </div></section>
  <section class="card"><button class="alt" id="refresh">라이선스 목록 새로고침</button><div id="result" class="hidden"></div><div id="list"></div></section>
</main><script>
const API='https://eeto-miracle-license.jjmen.workers.dev/v1/admin/licenses';
const $=id=>document.getElementById(id),out=$('result'),list=$('list');
function key(){return $('adminKey').value.trim()} function show(value){out.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);out.classList.remove('hidden')}
async function call(url,options={}){if(!key())throw Error('관리자 키를 입력하세요.');const response=await fetch(url,{...options,headers:{'content-type':'application/json','x-admin-key':key(),...(options.headers||{})}});const data=await response.json().catch(()=>({message:'서버 응답을 읽을 수 없습니다.'}));if(!response.ok)throw Error(data.message||data.code||'요청에 실패했습니다.');return data}
function stamp(value){return value?new Date(value).toLocaleDateString('ko-KR'):'제한 없음'}
async function refresh(){try{$('refresh').disabled=true;const data=await call(API);list.innerHTML=data.licenses.map(x=>`<article class="license"><div><strong>${escape(x.customer_name)}</strong> <span class="badge">${x.enabled?'사용':'중지'}</span><div class="note">키 끝: ${escape(x.key_suffix)} · PC ${x.active_devices}/${x.max_devices} · 만료 ${stamp(x.expires_at)}</div></div><div><button class="alt" data-edit="${x.id}" data-expiry="${x.expires_at||''}" data-devices="${x.max_devices}">기간·PC 수정</button> <button class="danger" data-id="${x.id}" data-enabled="${x.enabled?0:1}">${x.enabled?'중지':'재활성화'}</button></div></article>`).join('')||'<p class="note">등록된 라이선스가 없습니다.</p>';show({count:data.licenses.length});}catch(e){show(e.message)}finally{$('refresh').disabled=false}}
function escape(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
$('create').onclick=async()=>{try{$('create').disabled=true;const expires=$('expiresAt').value;const body={customerName:$('customerName').value.trim(),maxDevices:Number($('maxDevices').value),expiresAt:expires?new Date(expires+'T23:59:59+09:00').toISOString():null,features:['smart-pack']};const data=await call(API,{method:'POST',body:JSON.stringify(body)});show({message:'아래 licenseKey를 지금 복사해 고객에게 전달하세요. 이후에는 다시 표시할 수 없습니다.',licenseKey:data.licenseKey,product:'스마트팩',customerName:data.customerName,maxDevices:data.maxDevices,expiresAt:data.expiresAt});await refresh()}catch(e){show(e.message)}finally{$('create').disabled=false}};
list.onclick=async e=>{const edit=e.target.closest('button[data-edit]');if(edit){const current=edit.dataset.expiry?edit.dataset.expiry.slice(0,10):'';const date=prompt('새 만료일 (YYYY-MM-DD). 비워두면 만료일 제한 없음.',current);if(date===null)return;const devices=prompt('허용 PC 수 (1~50)',edit.dataset.devices);if(devices===null)return;try{await call(`${API}/${edit.dataset.edit}/update`,{method:'POST',body:JSON.stringify({expiresAt:date,maxDevices:Number(devices)})});await refresh()}catch(e){show(e.message)}return}const b=e.target.closest('button[data-id]');if(!b)return;try{b.disabled=true;await call(`${API}/${b.dataset.id}/status`,{method:'POST',body:JSON.stringify({enabled:b.dataset.enabled==='1'})});await refresh()}catch(e){show(e.message);b.disabled=false}};
</script></body></html>
